server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 10m;
  gzip on; gzip_types text/css application/javascript application/json;
  add_header X-Content-Type-Options nosniff;
  add_header X-Frame-Options DENY;
  location /api/ { proxy_pass http://gateway:8080; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
  location /health { proxy_pass http://gateway:8080; }
  location /assets/ { expires 7d; }
  location / { try_files $uri /index.html; }
}
