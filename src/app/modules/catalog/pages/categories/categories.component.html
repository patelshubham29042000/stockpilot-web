<app-page-header>
  <button type="button" class="btn pri" (click)="add()">Add category</button>
</app-page-header>
<p class="hint">Categories group your items. You pick one when you add or edit an item.</p>

@if (form(); as f) {
  <form class="card form" (ngSubmit)="save()">
    <label>Category name
      <input id="category-name" name="name" [(ngModel)]="f.name" required minlength="2" autocomplete="off">
    </label>
    <div class="row">
      <button class="btn ok" [disabled]="busy()">{{ f.id ? 'Save changes' : 'Add category' }}</button>
      <button type="button" class="btn cancel" (click)="cancel()">Cancel</button>
    </div>
  </form>
}

<div class="list-bar">
  <input type="search" placeholder="Search categories…" aria-label="Search categories"
         [ngModel]="search()" (ngModelChange)="search.set($event)">
  <span class="count">{{ shown().length }} {{ shown().length === 1 ? 'category' : 'categories' }}</span>
</div>

<app-tabulator-grid [columns]="columns" idField="id" [data]="shown()" [pageSize]="25" [responsive]="true" maxHeight="70vh"
                    placeholder="No categories yet. Add your first one." (rowAction)="onAction($event)" />
