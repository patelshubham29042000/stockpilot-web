<app-page-header [subtitle]="id ? 'Edit item' : 'New item'">
  <a class="btn pri" routerLink="/items">Back to items</a>
</app-page-header>
<app-notice [message]="error()" />

<form class="card form" (ngSubmit)="save()">
  <label>SKU<input name="sku" [(ngModel)]="model.sku" required></label>
  <label>Name<input name="name" [(ngModel)]="model.name" required></label>
  <label>Category
    <select name="category" [(ngModel)]="model.categoryId">
      <option [ngValue]="null">No category</option>
      @for (c of categories(); track c.id) { <option [ngValue]="c.id">{{ c.name }}</option> }
    </select>
  </label>
  <label>Supplier
    <select name="supplier" [(ngModel)]="model.supplierId">
      <option [ngValue]="null">No supplier</option>
      @for (s of suppliers(); track s.id) { <option [ngValue]="s.id">{{ s.name }}</option> }
    </select>
  </label>
  <label>Selling price<input name="price" type="number" min="0" step="0.01" [(ngModel)]="model.price"></label>
  <label>Cost<input name="cost" type="number" min="0" step="0.01" [(ngModel)]="model.cost"></label>
  @if (!id) {
    <label>Opening stock<input name="stock" type="number" min="0" [(ngModel)]="model.stock"></label>
  }
  <label>Reorder at<input name="reorderLevel" type="number" min="0" [(ngModel)]="model.reorderLevel"></label>
  <div class="row">
    <button class="btn pri" [disabled]="busy()">Save item</button>
    <a class="btn cancel" routerLink="/items">Cancel</a>
  </div>
</form>

@if (categories().length === 0) {
  <p class="note">
    There are no categories yet.
    @if (auth.can(PERM.categoriesManage)) { <a routerLink="/categories" class="link">Create one in Categories</a>, then come back. }
    @else { Ask an administrator to create one. }
  </p>
}
