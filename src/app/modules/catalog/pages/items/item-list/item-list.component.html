<app-page-header>
  @if (auth.can(PERM.itemsManage)) {
    <a class="btn pri" routerLink="/items/new">Add item</a>
    <label class="btn info">Import CSV<input type="file" accept=".csv" hidden (change)="import($event)"></label>
    <button type="button" class="btn info" (click)="exportCsv()">Export CSV</button>
  }
</app-page-header>
@if (auth.can(PERM.itemsManage)) {
  <p class="hint">CSV columns: sku, name, category, price, cost, qty, reorder. The qty is added to current stock.</p>
}

<div class="list-bar">
  <input type="search" placeholder="Search name or SKU…" aria-label="Search items"
         [ngModel]="search" (ngModelChange)="onSearch($event)">
  <label class="check">
    <input type="checkbox" [ngModel]="lowOnly" (ngModelChange)="onLowOnly($event)"> Low stock only
  </label>
  <span class="count">{{ rows().length }} {{ rows().length === 1 ? 'item' : 'items' }}</span>
</div>

<app-tabulator-grid [columns]="columns" idField="id" [data]="rows()" [pageSize]="25" [responsive]="true" maxHeight="70vh"
                    placeholder="No items match." (rowAction)="onAction($event)" />
