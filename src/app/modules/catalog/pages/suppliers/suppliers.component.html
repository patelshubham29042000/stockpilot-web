<app-page-header>
  <button type="button" class="btn pri" (click)="add()">Add supplier</button>
</app-page-header>

@if (form(); as f) {
  <form class="card form" (ngSubmit)="save()">
    <label>Name<input id="supplier-name" name="name" [(ngModel)]="f.name" required autocomplete="off"></label>
    <label>Phone<input name="phone" type="tel" [(ngModel)]="f.phone" autocomplete="off"></label>
    <label>Email<input name="email" type="email" [(ngModel)]="f.email" autocomplete="off"></label>
    <div class="row">
      <button class="btn ok" [disabled]="busy()">{{ f.id ? 'Save changes' : 'Add supplier' }}</button>
      <button type="button" class="btn cancel" (click)="cancel()">Cancel</button>
    </div>
  </form>
}

<div class="list-bar">
  <input type="search" placeholder="Search name, phone or email…" aria-label="Search suppliers"
         [ngModel]="search()" (ngModelChange)="search.set($event)">
  <span class="count">{{ shown().length }} {{ shown().length === 1 ? 'supplier' : 'suppliers' }}</span>
</div>

<app-tabulator-grid [columns]="columns" idField="id" [data]="shown()" [pageSize]="25" [responsive]="true" maxHeight="70vh"
                    placeholder="No suppliers yet. Add your first one." (rowAction)="onAction($event)" />
