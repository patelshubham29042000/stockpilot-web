<app-page-header />
<p class="hint">Who did what, and when. Shows the last 7 days by default, newest first (latest 200 matches).</p>

<form class="card filters" (ngSubmit)="apply()">
  <label>From date
    <input type="date" name="fromDate" [(ngModel)]="fromDate" [max]="toDate">
  </label>
  <label>To date
    <input type="date" name="toDate" [(ngModel)]="toDate" [min]="fromDate">
  </label>
  <label>Module
    <select name="source" [ngModel]="source" (ngModelChange)="source = $event; apply()">
      <option value="all">All</option>
      @for (m of modules; track m.value) { <option [value]="m.value">{{ m.label }}</option> }
    </select>
  </label>
  <label>User
    <select name="userName" [ngModel]="userName" (ngModelChange)="userName = $event; apply()">
      <option value="">All</option>
      @for (u of users(); track u) { <option [value]="u">{{ u }}</option> }
    </select>
  </label>
  <div class="filter-actions">
    <button class="btn pri" [disabled]="loading()">Filter</button>
    <button type="button" class="btn alt" [disabled]="loading()" (click)="reset()">Reset</button>
  </div>
</form>

<div class="list-bar">
  <input type="search" placeholder="Search user, action or details…" aria-label="Search the audit log"
         [ngModel]="search()" (ngModelChange)="search.set($event)">
  <span class="count">{{ shown().length }} {{ shown().length === 1 ? 'entry' : 'entries' }}</span>
</div>

<app-tabulator-grid [columns]="columns" idField="rid" [data]="shown()" [pageSize]="25" [responsive]="true" maxHeight="70vh"
                    placeholder="Nothing matches these filters." />
