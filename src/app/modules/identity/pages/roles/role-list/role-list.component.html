<app-page-header>
  @if (auth.can(PERM.rolesManage)) { <a class="btn pri" routerLink="/roles/new">New role</a> }
</app-page-header>
<p class="hint">A role is a set of permissions. Give a user a role to control what they can see and do.</p>

<div class="list-bar">
  <input type="search" placeholder="Search roles…" aria-label="Search roles"
         [ngModel]="search()" (ngModelChange)="search.set($event)">
  <span class="count">{{ shown().length }} {{ shown().length === 1 ? 'role' : 'roles' }}</span>
</div>

<app-tabulator-grid [columns]="columns" idField="id" [data]="shown()" [pageSize]="25" [responsive]="true" maxHeight="70vh"
                    placeholder="No roles yet. Create one, for example Manager or Cashier." (rowAction)="onAction($event)" />
