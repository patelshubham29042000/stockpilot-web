<app-page-header>
  <a class="btn pri" routerLink="/users/new">Add employee</a>
</app-page-header>
@if (pending() > 0) {
  <p class="note">{{ pending() }} account(s) are waiting for activation. Click Edit, choose a role and switch Active on.</p>
}

<div class="list-bar">
  <input type="search" placeholder="Search ID, name, username, mobile or designation…" aria-label="Search employees"
         [ngModel]="search()" (ngModelChange)="search.set($event)">
  <label class="check">
    <input type="checkbox" [ngModel]="pendingOnly()" (ngModelChange)="pendingOnly.set($event)"> Pending only
  </label>
  <span class="count">{{ shown().length }} {{ shown().length === 1 ? 'employee' : 'employees' }}</span>
</div>

<app-tabulator-grid [columns]="columns" idField="id" [data]="shown()" [pageSize]="25" [responsive]="true" maxHeight="70vh"
                    placeholder="No employees match." (rowAction)="onAction($event)" />
