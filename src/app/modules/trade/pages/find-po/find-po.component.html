<app-page-header>
  <button type="button" class="btn info" (click)="autoCreate()">Create from low stock</button>
  <a class="btn pri" routerLink="/purchase-orders/place">Place PO</a>
</app-page-header>
<p class="hint">Shows the last 7 days by default. Open an order with View. Pending orders can be completed (stock goes up) or cancelled.</p>

<form class="card filters" (ngSubmit)="apply()">
  <label>From date
    <input type="date" name="fromDate" [(ngModel)]="fromDate" [max]="toDate">
  </label>
  <label>To date
    <input type="date" name="toDate" [(ngModel)]="toDate" [min]="fromDate">
  </label>
  <label>Status
    <select name="status" [ngModel]="status" (ngModelChange)="status = $event; apply()">
      <option value="all">All</option>
      @for (s of statuses; track s) { <option [value]="s">{{ s }}</option> }
    </select>
  </label>
  <div class="filter-actions">
    <button class="btn pri" [disabled]="loading()">Filter</button>
    <button type="button" class="btn alt" [disabled]="loading()" (click)="reset()">Reset</button>
  </div>
</form>

<div class="list-bar">
  <input type="search" placeholder="Search PO number or supplier…" aria-label="Search purchase orders"
         [ngModel]="search()" (ngModelChange)="search.set($event)">
  <span class="count">{{ shown().length }} {{ shown().length === 1 ? 'order' : 'orders' }}</span>
</div>

<app-tabulator-grid [columns]="columns" idField="id" [data]="shown()" [pageSize]="10" [responsive]="true" maxHeight="70vh"
                    placeholder="No purchase orders match these filters." (rowAction)="onAction($event)" />
